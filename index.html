<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zagari</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="barra-superior">
        <p>Envíos a toda la Republica Mexicana</p>
        <p>Teocaltiche, Jalisco</p>
    </div>
    <header class="encabezado">
        <div class="marca">
            <img src="img/logo.png" alt="Logo de Zagari" class="logo">
            <h1>ZAGARI</h1>
        </div>
    
        <nav class="menu">
            <a href="#" class="activo">Inicio</a>
            <a href="#">Catalogo</a>
            <a href="#">Contacto</a>
            <a href="#">Nosotros</a>
        </nav>

        <div class="acciones">
            <span class="icono-buscar"></span>
            <span class="icono-instagram"></span>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero-texto">
                <h2>
                    Tu próximo<br>
                    bolso <span>favorito</span>
                </h2>
                <p>
                    Desde Teocaltiche<br>
                    hasta donde estés.
                </p>
                <a href="#" class="boton-catalogo">
                    Explorar catalogo
                    <span>→</span>

                </a>
            </div>
        </section>

        <section class="descubre">

    <div class="titulo-descubre">
        <span class="linea"></span>

        <h2>Descubre ZAGARI</h2>

        <span class="linea"></span>
    </div>

    <div class="categorias">

        <div class="tarjeta">
            <img src="img/coucc.jpeg" alt="Bolsas">

            <div class="tarjeta-info">
                <h3>Bolsas</h3>
                <span>→</span>
            </div>
        </div>

        <div class="tarjeta">
            <img src="img/azul.jpeg" alt="Carteras">

            <div class="tarjeta-info">
                <h3>Carteras</h3>
                <span>→</span>
            </div>
        </div>

        <div class="tarjeta">
            <img src="img/productos/sol.jpeg" alt="Cuidado y belleza">

            <div class="tarjeta-info">
                <h3>Cuidado y belleza</h3>
                <span>→</span>
            </div>
        </div>

    </div>

</section>
